# Stage table for scripts/submit.py -- one entry per (dataset, track, stage).
#
#   track  : embedding (ridge on hidden states) | surprisal (LME on scalar surprisal)
#   stage  : fit      -- embedding: extract+ridge; surprisal: CPU pooled-LME fit
#            extract  -- surprisal: GPU logit-lens surprisal + perplexity cache
#
# A stage = a shared runner (sourced) + the function it calls once per array task.
# The array itself is NOT listed here: submit.py derives it from the model registry
# (neuroai/models/registry.py), so every model in a family is always covered.
#
# Resources come from `profiles` (+ `large_model` for big models) and can be overridden
# per stage here or per call on the command line (--time, --gres, --cpus, ...).
# `env` holds per-stage defaults (worker counts etc.); override with --env KEY=VAL.
# `selectors` are the dataset variants exposed as --measure / --task.
defaults:
  time: 02:00:00
  hint: nomultithread
  output_dir: outputs_torch/logs
  # not submitted by --all-families (checkpoint sweeps are separate, deliberate runs; MoLM is run apart)
  excluded_families: [pythia_checkpoints, babylm_gpt2_checkpoints, molm]
profiles:
  cpu:
    account: torch_pr_287_general
    partition: cs
    cpus: 40
  gpu:
    account: torch_pr_287_general
    gres: gpu:1
    constraint: h100|h200|a100   # excludes L40S: no sm_89 kernels in this repo's CUDA 12.4 wheel
    cpus: 24
large_model:
  min_params: 20000000000.0
  gres: gpu:2
  cpus: 48
family_runtime:
  alibi:
    pythonpath:
    - forgetting-transformer/src
  forgetting:
    pythonpath:
    - forgetting-transformer/src
  hard_2gram:
    pythonpath:
    - forgetting-transformer/src
  hard_3gram:
    pythonpath:
    - forgetting-transformer/src
  hard_5gram:
    pythonpath:
    - forgetting-transformer/src
  stickbreaking:
    pythonpath:
    - forgetting-transformer/src
stages:
  broderick.embedding.fit:
    runner: scripts/slurm/torch/embedding/neural/broderick.sh
    family_var: BRODERICK_FAMILY
    fn: broderick_torch_run_array_task
    summary_fn: broderick_torch_run_summary
    profile: gpu
  fedorenko2016.embedding.fit:
    runner: scripts/slurm/torch/embedding/neural/fedorenko2016.sh
    family_var: FEDORENKO_FAMILY
    profile: gpu
    cpus: 16
  geco.embedding.fit:
    runner: scripts/slurm/torch/embedding/behavioral/geco.sh
    family_var: GECO_FAMILY
    fn: geco_torch_run_array_task_gpu
    summary_fn: geco_torch_run_summary
    profile: gpu
    cpus: 10
    selectors:
      measure:
        env: GECO_MEASURE
        values:
        - FP
        - GP
  lpp.embedding.fit:
    runner: scripts/slurm/torch/embedding/neural/lpp.sh
    family_var: LPP_FAMILY
    fn: lpp_torch_run_array_task
    summary_fn: lpp_torch_run_summary
    profile: gpu
  meco.embedding.fit:
    runner: scripts/slurm/torch/embedding/behavioral/meco.sh
