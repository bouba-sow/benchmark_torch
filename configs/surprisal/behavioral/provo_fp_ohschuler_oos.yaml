# ============================================================================
# Provo Corpus — First-Pass / Gaze Duration (FP) — LME Checkpoint Sweep
# ============================================================================
#
# Trial-level by-subject LME on raw first-pass duration (IA_FIRST_RUN_DWELL_TIME,
# ms — Clark-2025-style fit, mirroring UCL Reading / ZuCo Reading): unigram
# (KenLM) + current-word + spillover surprisal as fixed effects, random slopes
# by subject.
#
# FP = summed fixation duration during the first pass over a word (before the
# eyes leave it, forward or backward) — the "standard" reading-time measure in
# this literature (closest analog to SPR reading time).
#
# NOTE on caching: unlike ZuCo (SR/NR/TSR are three different sentence sets,
# cached separately), Provo's SP/FP/GP measures share the exact same 55-passage
# word set — only the outcome duration column differs. The surprisal + KenLM
# caches below are therefore NOT nested per measure; a cache built while running
# this config is reused as-is by provo_lme_sweep_{sp,gp}.yaml.
#
# Requires R + lme4 on the runtime host (Jean Zay: module load r/4.5.2).
#
# Run locally:
#   .venv/bin/python scripts/run/surprisal/behavioral/provo_fit.py \
#     --config configs/surprisal/behavioral/provo_fp.yaml \
#     --from-registry --family gpt2 --array-index 0 --device cuda
# ============================================================================

dataset:
  root: ${BENCHMARK_ROOT}/data/provo/osfstorage
  measure: FP               # SP | FP | GP
  texts: null                # null = all 55 passages
  min_dur: 50.0               # ms, drop implausibly short durations
  max_dur: 5000.0             # ms, drop implausibly long durations (regressions/blinks)
  exclude_doc_edges: true     # also drop passage-initial/-final words (Provo-specific;
                               # UCL/ZuCo only drop sentence edges)

lme:
  include_surprisal: true
  include_prev_surprisal: false  # Oh & Schuler 2023 (arXiv:2304.11389) do not include spillover
  include_freq: false          # Oh & Schuler 2023: no frequency covariate ("avoid confounds introduced by the corpus used for frequency estimation")
  filter_sentence_edges: true    # drops any row where is_edge=true (sentence OR doc edge)
  compare_baseline: true
  out_of_sample: true
  add_sentence_intercept: true  # Oh & Schuler 2023: crossed (1 | sentid) random intercept for eye-gaze data
  partition_mod: 4
  partition_fit_indices: [0, 1]   # ~50% train
  partition_test_indices: [2, 3]  # ~50% test (OOS ΔLogLik, correlations)
  verbose: false

cache:
  # Shared across SP/FP/GP — do NOT nest per measure (see note above).
  features_dir: ${PROVO_FEATURE_CACHE_DIR}

output:
  save_dir: outputs/provo/surprisal_sweep/fp

models: []
