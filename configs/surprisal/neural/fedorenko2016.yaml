# ============================================================================
# Fedorenko2016 iEEG — Pooled LME per LM layer (logit-lens surprisal)
# ============================================================================
#
# y ~ wlen_z + freq_z + prev_surprisal_z + surprisal_z +
#     (1 + wlen_z + freq_z + prev_surprisal_z + surprisal_z | subject) +
#     (1 + surprisal_z | subject:electrode)
# vs. the same formula without surprisal_z, fit ONCE PER LM LAYER, pooling
# every subject and electrode together. Fedorenko2016's SEEG/ECoG electrodes
# are patient-specific grids (no shared coordinate system across subjects),
# so electrode is a NESTED random effect (subject:electrode) — same as
# Podcast's ECoG, unlike the N400 datasets' crossed scalp electrode.
#
# No lags (unlike Podcast): "Neural targets are scalar responses per
# electrode column (no time axis)" — one row per (word, electrode).
#
# TWO-STAGE PIPELINE (same split as the N400 datasets' pooled LMEs): on Jean
# Zay, R (pymer4/lme4, needed for the LME fit) is only available on CPU
# partitions, not GPU. So:
#   1. GPU stage — extract + cache per-layer logit-lens surprisal for all 416
#      words (one forward pass per sentence, 52 sentences):
#        .venv/bin/python scripts/run/surprisal/neural/fedorenko2016_extract.py \
#          --config configs/surprisal/neural/fedorenko2016.yaml \
#          --model_name openai-community/gpt2 --device cuda
#   2. CPU stage — fit one LME per layer, reading surprisal from that cache
#      (N layers fit concurrently via a spawned process pool — NOT one SLURM
#      job per layer):
#        .venv/bin/python scripts/run/surprisal/neural/fedorenko2016_fit.py \
#          --config configs/surprisal/neural/fedorenko2016.yaml \
#          --model_name openai-community/gpt2 --n_workers 10
# ============================================================================

dataset:
  root: ${BENCHMARK_ROOT}/data/fedorenko2016
  max_length: null
  tokenizer_no_revision: true
  trust_remote_code: false
  wordfreq_language: en
  # Device for the (cheap, 52-sentence) surprisal extraction forward passes.
  # The CPU-only LME stage overrides this to "cpu" regardless (see
  # run/surprisal/neural/fedorenko2016_fit.py) — it only matters for the GPU extraction
  # stage / direct single-job runs.
  device: cpu

lme:
  train_frac: 0.75
  split_random_state: 0
  verbose: false
  # Barr et al. (2013)-style simplification ladder if the full model (with
  # the correlated random slope on subject:electrode) fails to converge:
  # drop the correlation first, then the slope entirely. Applied identically
  # to every layer so comparisons stay valid.
  allow_slope_fallback: true
  layer_stride: 1

output:
  save_dir: ${BENCHMARK_ROOT}/outputs/fedorenko2016/surprisal_sweep

cache:
  # Must already contain this model's logit-lens fulltext surprisal cache
  # (populated by run/surprisal/neural/fedorenko2016_extract.py) before running the
  # CPU-only LME sweep.
  features_dir: ${FEDORENKO2016_LME_FEATURE_CACHE_DIR}
