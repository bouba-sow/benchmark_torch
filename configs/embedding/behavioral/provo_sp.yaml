# ============================================================================
# Provo Corpus — Scan Path / Total Dwell Time (SP) — Embedding Ridge Checkpoint Sweep
# ============================================================================
#
# Word-level ridge regression: rt_mean (IA_DWELL_TIME, ms, averaged across
# subjects who fixated the word) ~ per-layer LLM contextual embedding.
# Behavioral analogue of NeuralBenchmark's per-layer iEEG ridge regression;
# complements configs/surprisal/behavioral/provo_sp.yaml (scalar surprisal -> RT via LME).
#
# SP = total fixation time on a word across ALL passes (including re-reads /
# regressions) — the noisiest of the three Provo measures since it conflates
# early lexical access with late integration/regression effects.
#
# NOTE on caching: like the surprisal cache, embeddings are cached per
# (model, revision, story_id) — NOT nested per measure, so a cache built while
# running this config is reused as-is by provo_embed_sweep_{fp,gp}.yaml.
#
# Run locally:
#   .venv/bin/python scripts/run/embedding/behavioral/provo.py \
#     --config configs/embedding/behavioral/provo_sp.yaml \
#     --from-registry --family gpt2 --array-index 0 --device cuda
# ============================================================================

dataset:
  root: ${BENCHMARK_ROOT}/data/provo/osfstorage
  measure: SP                 # SP | FP | GP
  texts: null                 # null = all 55 passages
  min_dur: 50.0                # ms, drop implausibly short durations
  max_dur: 5000.0              # ms, drop implausibly long durations (regressions/blinks)
  exclude_doc_edges: true      # also drop passage-initial/-final words
  context_words: 64            # >= longest passage (62 words) -> full cumulative context
  max_length: 512

group_cv_by_story: true
# Fit independently per subject (mirrors NeuralBenchmark's per-electrode
# fitting) -- skip a subject with fewer than this many trials left after
# filtering. n_jobs = threads per subject (layers); subject_n_jobs =
# concurrent subject processes. Total cores used ~= n_jobs * subject_n_jobs
# -- size against your node's cpus-per-task and RAM (each concurrent
# subject process holds its own embedding-array copy).
min_trials_per_subject: 20
n_jobs: 24                     # averaged-only frees the cores per-subject processes used -> all to per-layer parallelism
subject_n_jobs: 10
filter_sentence_edges: true

# ---- grand-average-subject methodology (de Varda et al. 2026) ----
# Average RT across subjects per (story_id, zone) word -> one "grand-average
# subject" -> a single ridge CV per layer. No per-subject fitting.
average_across_subjects: true
average_only: true
min_subjects_per_item: 1        # available-case mean (Provo passages are read
                               # by most subjects, so ~no item loss)

regression:
  n_splits: 5
  alpha: "np.logspace(0, 10, 11)"   # padded Provo FP grid, shared across FP/GP/SP
  scale: true
  random_state: 0
  print_chosen_ridge_alpha: true

cache:
  features_dir: ${PROVO_EMBED_CACHE_DIR}

output:
  save_dir: outputs/provo/embedding_sweep/sp

models: []
