# ---------------------------------------------------------------------------
# Encoding / regression hyper-parameters
# ---------------------------------------------------------------------------
encoding:
  feature_mode: huggingface
  hf_extraction_mode: lbg_fulltext
  hf_lbg_story_text_zip: ${BENCHMARK_ROOT}/data/lpp_fmri_extra/lbg_story_text/lpp_en_text.zip
  hf_lbg_stride_delta: 64
  hf_lbg_max_length: null
  hf_tokenizer_no_revision: true

  hrf_model: glover
  trim_trs_start: 10
  trim_trs_end: 10
  smoothing_fwhm: null
  high_pass_hz: null

  strict_lbg_parity: true
  min_word_duration_sec: 0.0

  ridge_alphas:
    - 1000.0
    - 2154.43
    - 4641.59
    - 10000.0
    - 21544.35
    - 46415.89
    - 100000.0
    - 215443.47

  max_voxels: null
  reliable_voxel_fraction: 0.25
  reliable_voxel_scores_path: ${BENCHMARK_ROOT}/data/lpp_fmri_extra/average_subject/isc/isc_10trials_en.gz
  mask_from_runs: 3
  picture_nuisance_regressors: false
  random_state: 0
  regression_device: cuda
  n_layer_workers: 8
  ridge_n_jobs: 1
  layer_n_jobs: 1
  brain_mask_path: ${BENCHMARK_ROOT}/data/lpp_fmri_extra/masks/mask_lpp_en.nii.gz


# ---------------------------------------------------------------------------
# Analysis toggles
# ---------------------------------------------------------------------------
analysis:
  per_layer: true
  lateralization: true
  roi_masks_dir: ${BENCHMARK_ROOT}/data/lpp_fmri_extra/average_subject/roi_masks
  harvard_oxford_parcels: true


# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------
cache:
  features_dir: .cache/lpp_features
  embeddings_dir: .cache/embeddings


# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  save_dir: outputs/lpp/embedding_sweep
  incremental_save: true
  plots: true
  save_corr_maps: false
  save_granular_outputs: true
  save_voxel_scores: true
