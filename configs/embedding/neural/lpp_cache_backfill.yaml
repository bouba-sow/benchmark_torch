# ============================================================================
# Le Petit Prince (LPP) fMRI — Checkpoint Sweep Configuration
# ============================================================================
#
# Run:
#   python scripts/run/embedding/neural/lpp.py --config configs/embedding/neural/lpp.yaml
#
# Paths use ${BENCHMARK_ROOT} (expanded by os.path.expandvars).
#   Local default: the repo root (auto-detected by load_config).
#   Jean Zay:       export BENCHMARK_ROOT=$WORK/benchmark
#
# To run a partial sweep (e.g. fewer Pythia-12B steps), use --steps on the CLI
# instead of creating a separate config file:
#   python scripts/run/embedding/neural/lpp.py \
#     --config configs/embedding/neural/lpp.yaml \
#     --models EleutherAI/pythia-12b-deduped --steps 2000 4000 8000 16000
#
# This file fully specifies:
#   - Dataset-specific params (Le Petit Prince).
#   - Which models and checkpoints to sweep.
#   - Encoding / regression hyper-parameters.
#   - Analysis toggles (per-layer, lateralization).
#   - Output settings.
#
# ============================================================================

# ---------------------------------------------------------------------------
# Active dataset selector
# ---------------------------------------------------------------------------
# Only the block matching this key is read at runtime.
active_dataset: lpp


# ---------------------------------------------------------------------------
# Dataset configurations
# ---------------------------------------------------------------------------
datasets:

  lpp:
    bids_root: ${BENCHMARK_ROOT}/data/lpp_fmri

    # Language: en | fr | cn
    lang: en

    # fMRI target (match l-bg ``fit_average_subject.py``):
    #   single_subject — one participant per encoding run (``subjects`` below).
    #   average_subject — mean masked BOLD over ``average_subject_subjects`` (or
    #     ``subjects`` if set, else all ``derivatives/sub-<LANG>*`` participants).
    #     The sweep runs **one** encoding job; ``subjects: [ref]`` only picks who
    #     defines run↔section pairing when not using explicit average list.
    fmri_unit: average_subject

    # Optional explicit list for group mean (overrides ``subjects`` for averaging).
    # null with fmri_unit=average_subject → all English participants under derivatives/.
    average_subject_subjects: null
    # Use l-bg precomputed average subject directly (average_subject_run-0..8.gz).
    # When set, this is preferred over recomputing from derivatives.
    average_subject_precomputed_dir: ${BENCHMARK_ROOT}/data/lpp_fmri_extra/average_subject/bold

    # For fmri_unit: single_subject — list of IDs or null to auto-discover.
    # For average_subject with average_subject_subjects: null — may be omitted or
    # set to [first_id] to choose which participant defines BIDS run order.
    subjects: [sub-EN057]

    # BOLD source: "derivatives" (preprocessed, recommended) | "raw"
    bold_source: derivatives

    # Echo index — only relevant when bold_source: raw.
    echo: 2

    # Apply l-bg word-table fixes (index drops / replacements for EN/FR).
    # Matches ``extract_llm_activations.py`` word table cleanup.
    apply_lbg_fixes: true

    # Same as encoding.brain_mask_path (dataset-level alias).
    lbg_brain_mask_path: ${BENCHMARK_ROOT}/data/lpp_fmri_extra/masks/mask_lpp_en.nii.gz


# ---------------------------------------------------------------------------
# Models & checkpoints
# ---------------------------------------------------------------------------
# Each entry defines one model family. The sweep iterates over all
# checkpoints listed (or derived from steps for Pythia).
#
# Fields per model:
#   model_id     — HuggingFace model identifier
#   label        — short display name (used in plot titles and CSV)
#   n_layers     — total hidden layers including token embedding (layer 0)
#   n_params     — approximate parameter count (used for scaling plots)
#   device       — "cuda" | "cpu" | "auto"
#   family       — "pythia" | "olmo2" | "gpt2" | "other"
#   checkpoints  — sub-section (see below)
#
# Checkpoint sub-sections:
#   For Pythia (family: pythia):
#     type: steps
#     steps: [0, 128, 512, ...]   → revisions become "step0", "step128", etc.
#
#   For OLMo-2 (family: olmo2):
#     type: revisions
#     revisions: [stage1-step150-tokens1B, ...]
# ---------------------------------------------------------------------------
models:

  # ---- Pythia 1B ----
  - model_id: EleutherAI/pythia-1b-deduped
    label: Pythia-1B-deduped
    n_layers: 17
    n_params: 1.0e9
    device: cuda
    family: pythia
    checkpoints:
      type: steps
      steps:
        - 0
        - 128
        - 512
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
        - 32000
        - 64000
        - 128000
        - 143000

